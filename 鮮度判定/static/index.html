<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鮮度チェッカー</title>
<style>
  :root {
    --bg: #f6f7f4; --card: #fff; --text: #1d2420; --muted: #5f6b64; --line: #dde3de;
    --accent: #2f7d4f; --good: #2f7d4f; --ok: #6b9a2c; --warn: #c58a12; --bad: #c0392b; --none: #7a8580;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141816; --card: #1d2320; --text: #e8ece9; --muted: #9aa69f; --line: #2e3632;
      --accent: #4fb37a; --good: #4fb37a; --ok: #9cc75a; --warn: #e0a83a; --bad: #e5675a; --none: #8b9690;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  main { max-width: 520px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .shoot {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 16px; border: 0; border-radius: 12px;
    background: var(--accent); color: #fff; font-size: 17px; font-weight: 600; cursor: pointer;
  }
  .shoot:disabled { opacity: .6; cursor: wait; }
  input[type=file] { display: none; }
  #preview { display: none; width: 100%; max-height: 320px; object-fit: contain; border-radius: 10px; margin-top: 12px; background: var(--bg); }
  .status { text-align: center; color: var(--muted); margin: 12px 0 0; min-height: 1.6em; }
  .error { color: var(--bad); }
  #result { display: none; }
  .head { display: flex; align-items: center; gap: 16px; }
  .gauge { position: relative; width: 92px; height: 92px; flex: none; }
  .gauge svg { transform: rotate(-90deg); }
  .gauge .num { position: absolute; inset: 0; display: grid; place-items: center; font-size: 26px; font-weight: 700; }
  .food { font-size: 20px; font-weight: 700; margin: 0; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; color: #fff; font-size: 14px; font-weight: 600; margin-top: 4px; }
  .summary { margin: 14px 0 0; }
  h2 { font-size: 15px; margin: 16px 0 6px; color: var(--muted); }
  ul { margin: 0; padding-left: 1.2em; }
  li { margin: 2px 0; }
  .note { font-size: 12px; color: var(--muted); margin-top: 16px; }
</style>
</head>
<body>
<main>
  <h1>鮮度チェッカー</h1>
  <p class="lead">売り場で野菜・果物・魚・肉を撮影すると、見た目から鮮度を判定します。</p>

  <div class="card">
    <label>
      <input id="file" type="file" accept="image/*" capture="environment">
      <span class="shoot" id="shoot" role="button">📷 撮影して判定</span>
    </label>
    <img id="preview" alt="撮影した写真">
    <p class="status" id="status"></p>
  </div>

  <div class="card" id="result">
    <div class="head">
      <div class="gauge">
        <svg width="92" height="92" viewBox="0 0 92 92">
          <circle cx="46" cy="46" r="40" fill="none" stroke="var(--line)" stroke-width="8"/>
          <circle id="arc" cx="46" cy="46" r="40" fill="none" stroke-width="8" stroke-linecap="round"
                  stroke-dasharray="251.3" stroke-dashoffset="251.3"/>
        </svg>
        <div class="num" id="score"></div>
      </div>
      <div>
        <p class="food" id="food"></p>
        <span class="badge" id="grade"></span>
      </div>
    </div>
    <p class="summary" id="summary"></p>
    <h2>見えた根拠</h2><ul id="observations"></ul>
    <h2>手に取って確認したい点</h2><ul id="check_points"></ul>
    <h2>アドバイス</h2><ul id="tips"></ul>
    <p class="note">写真の見た目による目安です。匂いや消費期限も合わせて確認してください。</p>
  </div>
</main>

<script>
const GRADE_COLOR = {
  "新鮮": "--good", "良好": "--ok", "早めに消費": "--warn", "避けたほうが良い": "--bad", "判定不能": "--none",
};
const $ = (id) => document.getElementById(id);

// 送信前に長辺 1568px の JPEG に縮小する（通信量と判定時間を減らす）
async function shrink(file) {
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, 1568 / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(bitmap.width * scale);
  canvas.height = Math.round(bitmap.height * scale);
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  return new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.85));
}

function fillList(id, items) {
  const ul = $(id);
  ul.replaceChildren(...(items.length ? items : ["—"]).map((t) => {
    const li = document.createElement("li");
    li.textContent = t;
    return li;
  }));
}

function render(r) {
  const color = getComputedStyle(document.documentElement).getPropertyValue(GRADE_COLOR[r.grade] || "--none");
  $("food").textContent = r.food;
  $("grade").textContent = r.grade;
  $("grade").style.background = color;
  $("score").textContent = r.grade === "判定不能" ? "—" : r.score;
  $("arc").style.stroke = color;
  $("arc").style.strokeDashoffset = 251.3 * (1 - Math.max(0, Math.min(100, r.score)) / 100);
  $("summary").textContent = r.summary;
  fillList("observations", r.observations);
  fillList("check_points", r.check_points);
  fillList("tips", r.tips);
  $("result").style.display = "block";
  $("result").scrollIntoView({ behavior: "smooth", block: "start" });
}

$("file").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  $("preview").src = URL.createObjectURL(file);
  $("preview").style.display = "block";
  $("result").style.display = "none";
  $("status").className = "status";
  $("status").textContent = "判定中…（10〜30秒ほどかかります）";
  $("shoot").setAttribute("aria-disabled", "true");
  $("file").disabled = true;
  try {
    const blob = await shrink(file);
    const res = await fetch("/api/judge", { method: "POST", headers: { "Content-Type": "image/jpeg" }, body: blob });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || `エラー (${res.status})`);
    $("status").textContent = "";
    render(body);
  } catch (err) {
    $("status").className = "status error";
    $("status").textContent = err.message;
  } finally {
    $("file").disabled = false;
    $("file").value = "";
    $("shoot").removeAttribute("aria-disabled");
  }
});
</script>
</body>
</html>
